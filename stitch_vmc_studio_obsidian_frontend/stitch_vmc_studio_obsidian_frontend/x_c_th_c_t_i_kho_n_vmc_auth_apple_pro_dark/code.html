xt font-body-md text-body-md min-h-screen selection:bg-surface-container-highest"><main class="w-full min-h-screen flex items-center justify-center p-space-md bg-surface-container-lowest"><div class="flex flex-col w-full items-center justify-center py-space-xl px-space-md selection:bg-surface-container-highest">
<!-- Centered Login Card: macOS Pro Aesthetic -->
<div class="w-full max-w-[440px] bg-surface rounded-[20px] p-8 md:p-10 shadow-2xl relative transition-all duration-300">
<!-- Top Branding & Gateway Pill -->
<div class="flex flex-col items-center text-center">
<!-- Status Badge -->
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-surface2 shadow-sm mb-6">
<span class="w-1.5 h-1.5 rounded-full bg-tally-success inline-block"></span>
<span class="font-telemetry-sm text-telemetry-sm uppercase text-text tracking-wider">VMC Studio • Auth Gateway</span>
</div>
<!-- VMC Logo -->
<div class="w-16 h-16 mb-5 flex items-center justify-center">
<img alt="VMC Logo" class="w-full h-full object-contain filter drop-shadow-sm select-none" loading="eager" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBl3Btk0kVmwcVDO3qinYxmLQptTXfKfMXDjdRnelOJbnQD39GA5hjc-K03HYS4iwNNkTDtFgB1Lhar-cMA7V6OH8gtsJuXJjohlrKcV0renNx0KD7xWvBL3vQp9ATttE3WMUNI6ZR_4yraYzBMyXLJD2CRRGgEvUYV04QWg7TaG0K4Eucn9LFqLSr2oSBCdqV-vz7BKeiKcKztaQUtQpi76EauypLIxZyfnu_faZrBgb7mAPi_WsYSjeHpewjLyyyOqkI"/>
</div>
<!-- Heading -->
<h1 class="font-headline-lg text-headline-lg text-text font-semibold tracking-tight">Đăng nhập</h1>
<p class="font-body-sm text-body-sm text-text-muted mt-1.5 font-normal">Hệ thống quản trị sáng tạo VMC Studio</p>
</div>
<!-- Form Section -->
<form class="mt-8 space-y-4" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-1.5">
<label class="font-body-sm text-body-sm text-text font-medium text-left" for="vmc-email">Email công việc</label>
<div class="relative flex items-center">
<input class="w-full h-11 px-3.5 bg-surface2 text-text placeholder-text-telemetry rounded-[10px] font-body-md text-body-md focus:outline-none focus:bg-surface3 transition-colors duration-150" id="vmc-email" placeholder="creator@vmcstudio.vn" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-body-sm text-body-sm text-text font-medium" for="vmc-password">Mật khẩu</label>
<a class="font-body-sm text-body-sm text-text-muted hover:text-text transition-colors" href="#">Quên mật khẩu?</a>
</div>
<div class="relative flex items-center">
<input class="w-full h-11 pl-3.5 pr-11 bg-surface2 text-text placeholder-text-telemetry rounded-[10px] font-body-md text-body-md focus:outline-none focus:bg-surface3 transition-colors duration-150" id="vmc-password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-text-muted hover:text-text p-1 flex items-center justify-center transition-colors focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]">visibility</span>
</button>
</div>
</div>
<!-- Keep me logged in -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2.5 cursor-pointer select-none">
<input checked="" class="peer sr-only" id="remember-me" type="checkbox"/>
<div class="w-4 h-4 rounded-[4px] bg-surface2 peer-checked:bg-text flex items-center justify-center transition-all duration-150 shadow-inner">
<svg class="w-2.5 h-2.5 text-surface hidden peer-checked:block" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 12 12">
<polyline points="2.5 6 5 8.5 9.5 3.5"></polyline>
</svg>
</div>
<span class="font-body-sm text-body-sm text-text-muted hover:text-text transition-colors">Duy trì đăng nhập</span>
</label>
</div>
<!-- Primary Action Button: Pill Button -->
<div class="pt-2">
<button class="w-full h-11 rounded-full bg-text hover:bg-white text-surface font-title-sm text-title-sm font-semibold flex items-center justify-center transition-colors duration-150 shadow-md active:scale-[0.99]" type="submit">
          Đăng nhập
        </button>
</div>
</form>
<!-- Divider: HOẶC -->
<div class="relative my-6 flex items-center justify-center">
<div class="w-full h-[1px] bg-surface3"></div>
<span class="absolute px-3 bg-surface font-label-caps text-label-caps text-text-telemetry tracking-widest uppercase">Hoặc</span>
</div>
<!-- Secondary Login: Google Workspace -->
<button class="w-full h-11 rounded-full bg-surface2 hover:bg-surface3 text-text font-body-md text-body-md font-medium flex items-center justify-center gap-3 transition-colors duration-150 shadow-sm active:scale-[0.99]" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.4 8.9 5 12 5z" fill="#EA4335"></path>
<path d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z" fill="#4285F4"></path>
<path d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.4s.2-1.6.4-2.4L1.6 7c-.8 1.6-1.3 3.4-1.3 5.3s.5 3.7 1.3 5.3l3.7-2.9z" fill="#FBBC05"></path>
<path d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.1L1.6 16.1C3.5 20 7.4 23 12 23z" fill="#34A853"></path>
</svg>
<span>Tiếp tục với Google Workspace</span>
</button>
<!-- Bottom Footnotes & Telemetry -->
<div class="mt-8 pt-5 flex flex-col items-center gap-3">
<a class="font-body-sm text-body-sm text-text-muted hover:text-text transition-colors" href="#">
        Yêu cầu cấp quyền Creator
      </a>
<div class="flex items-center gap-2">
<span class="w-1.5 h-1.5 rounded-full bg-tally-success inline-block"></span>
<span class="font-telemetry-sm text-telemetry-sm text-text-telemetry tracking-wide">Hệ thống hoạt động bình thường</span>
</div>
</div>
</div>
<!-- Micro-interaction script -->
<script>
    (function() {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('vmc-password');
      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          const icon = toggleBtn.querySelector('.material-symbols-outlined');
          if (icon) {
            icon.textContent = isPassword ? 'visibility_off' : 'visibility';
          }
        });
      }
    })();
  </script>
</div></main></body></html>
